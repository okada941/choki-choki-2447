name: compile-1reo
on:
  workflow_dispatch:
jobs:
  compile_i1q:
    runs-on: ubuntu-latest
    timeout-minutes: 338
    steps:
      - uses: actions/checkout@v4
      - run: echo ok
      - run: go version 2>/dev/null || true
      - run: nproc
